<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Totonio Presentation Test Harness</title>
  <link rel="stylesheet" href="../.test-build/harness.css">
  <style>
    :root { --background-primary: #fff; --background-modifier-border: #d9dcdf; --background-modifier-hover: #edf0f2; --text-normal: #22262a; --text-muted: #626971; --text-error: #b32936; --interactive-accent: #287562; --text-on-accent: #fff; --font-interface: 'Avenir Next', sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; }
    #pane { width: 100%; height: 100%; min-width: 0; min-height: 0; }
  </style>
</head>
<body>
  <main id="pane"></main>
  <script type="module" src="../.test-build/harness.js"></script>
</body>
</html>
